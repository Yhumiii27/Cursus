# Vérification automatique de chaque modification : contrôle du code (oxlint), typage, tests avec seuil de couverture
# (serveur et client), compilation de l'interface ; parcours de bout en bout (Playwright) en tâche séparée, non bloquante.
# Toute la logique est dans `npm run check` (package.json) : une autre forge (GitLab, Azure DevOps) l'appelle en une ligne
# après `npm ci`. Version de Node : .nvmrc (22), celle qui fait foi ; Node 24 est essayé en plus, sans bloquer.
name: Vérification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: npm run check (Node ${{ matrix.nom }})
    runs-on: ubuntu-24.04
    # Les tests lancent de vrais serveurs (une dizaine de fichiers) : quelques minutes suffisent d'ordinaire.
    timeout-minutes: 20
    # Node 24 : essai pour anticiper la prochaine version, sans bloquer une modification.
    continue-on-error: ${{ !matrix.reference }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: 22 (.nvmrc)
            fichier: .nvmrc
            reference: true
          - nom: '24'
            version: '24'
    env:
      # Fuseau du serveur de production (docs/DEPLOIEMENT.md).
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ matrix.fichier }}
          node-version: ${{ matrix.version }}
          cache: npm
      - run: node --version
      - run: npm ci
      - run: npm run check
      # Failles connues des dépendances (base de npm) : celles de production, installées sur le serveur, bloquent à
      # partir de la gravité « high » (npm run audit, utilisable par toute forge) ; celles de développement (compilation
      # et tests, absentes du serveur) sont seulement signalées. Mises à jour proposées par Dependabot (.github/dependabot.yml).
      - name: Audit des dépendances de production
        if: matrix.reference
        run: npm run audit
      - name: Audit de toutes les dépendances (information)
        if: matrix.reference
        continue-on-error: true
        run: npm audit --audit-level=high
      # Interface compilée par la version de référence : téléchargeable pour l'instance de recette du groupe pilote.
      - name: Publier dist/
        if: matrix.reference
        uses: actions/upload-artifact@v7
        with:
          name: cursus-dist-${{ github.sha }}
          path: dist/
          retention-days: 30

  # Parcours complets par rôle (t165) dans Chromium, Microsoft Edge et un téléphone simulé, sur une base jetable de
  # démonstration à date figée (playwright.config.ts, e2e/). Non bloquant au début : un échec est signalé et le rapport
  # publié, sans refuser la modification. Ailleurs qu'à GitHub : npm ci, npx playwright install --with-deps chromium
  # msedge, npm run build, npm run e2e.
  e2e:
    name: Parcours de bout en bout (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    env:
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium msedge
      - run: npm run build
      - run: npm run e2e
      - name: Publier le rapport
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: rapport-e2e-${{ github.sha }}
          path: playwright-report/
          retention-days: 14
