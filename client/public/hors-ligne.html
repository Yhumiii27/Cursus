<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#161826" />
    <title>Cursus — Hors ligne</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/hors-ligne.css" />
  </head>
  <body>
    <!-- Page de secours du service worker (client/public/sw.js) quand la page de l'application n'est pas encore gardée sur
         l'appareil : aucune donnée, aucun script. -->
    <main>
      <img src="/icons/icon-192.png" alt="" width="64" height="64" />
      <h1>Hors ligne</h1>
      <p>Cursus n’a pas pu être joint. Vérifiez le réseau (Wi-Fi ou données mobiles), puis réessayez.</p>
      <p>Les saisies déjà gardées sur cet appareil seront envoyées à l’ouverture de Cursus, une fois le réseau revenu.</p>
      <p><a href="/">Réessayer</a></p>
    </main>
  </body>
</html>
